<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bíblia da Igreja</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header class="topo">

        <div class="logo">
            📖
        </div>

        <div>
            <h1>Bíblia da Igreja</h1>
            <p>Sistema de projeção</p>
        </div>

    </header>


    <!-- =========================
         CONTEÚDO
    ========================== -->

    <main class="container">


        <!-- =========================
             PAINEL DE CONTROLE
        ========================== -->

        <section class="painel-controle">

            <h2>Localizar passagem</h2>


            <!-- LIVRO -->

            <div class="campo">

                <label for="livro">
                    Livro
                </label>

                <select id="livro">

                    <option value="">
                        Selecione um livro
                    </option>

                </select>

            </div>


            <!-- CAPÍTULO -->

            <div class="campo">

                <label for="capitulo">
                    Capítulo
                </label>

                <select id="capitulo">

                    <option value="">
                        Selecione o capítulo
                    </option>

                </select>

            </div>


            <!-- VERSÍCULO -->

            <div class="campo">

                <label for="versiculo">
                    Versículo
                </label>

                <select id="versiculo">

                    <option value="">
                        Selecione o versículo
                    </option>

                </select>

            </div>


            <!-- BOTÕES -->

            <div class="grupo-botoes">

                <button id="btnMostrar">
                    📖 Mostrar versículo
                </button>

                <button
                    id="btnCapitulo"
                    class="btn-secundario">

                    📜 Ler capítulo inteiro

                </button>

            </div>


            <!-- NAVEGAÇÃO -->

            <div class="navegacao">

                <button
                    id="btnAnterior"
                    class="btn-navegacao">

                    ⬅ Anterior

                </button>

                <button
                    id="btnProximo"
                    class="btn-navegacao">

                    Próximo ➡

                </button>

            </div>


            <div class="atalhos">

                <strong>⌨️ Atalhos</strong>

                <span>← → capítulos</span>

                <span>↑ ↓ versículos</span>

                <span>Esc sai do telão</span>

            </div>

        </section>



        <!-- =========================
             ÁREA DA BÍBLIA
        ========================== -->

        <section
            class="painel-versiculo"
            id="painelVersiculo">


            <div class="icone-biblia">
                📖
            </div>


            <div
                class="referencia"
                id="referencia">

                Selecione uma passagem

            </div>


            <div
                class="texto-versiculo"
                id="textoVersiculo">

                O texto aparecerá aqui.

            </div>


            <!-- LISTA DO CAPÍTULO -->

            <div
                class="lista-versiculos"
                id="listaVersiculos">

            </div>


            <!-- CONTROLES -->

            <div class="controles-leitura">

                <button
                    class="btn-projetar"
                    id="btnProjetar">

                    📺 Projetar no telão

                </button>

            </div>


        </section>

    </main>



    <!-- =========================
         RODAPÉ
    ========================== -->

    <footer>

        Bíblia da Igreja
        •
        Sistema de projeção

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
