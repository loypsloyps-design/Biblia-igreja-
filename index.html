<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bíblia da Igreja</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="topo">

        <div class="logo">
            📖
        </div>

        <div>
            <h1>Bíblia da Igreja</h1>
            <p>Sistema de projeção</p>
        </div>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container">

        <!-- PAINEL DE CONTROLE -->
        <section class="painel-controle">

            <h2>Localizar passagem</h2>

            <div class="campo">

                <label for="livro">
                    Livro
                </label>

                <select id="livro">

                    <option value="">
                        Selecione um livro
                    </option>

                    <option>Gênesis</option>
                    <option>Êxodo</option>
                    <option>Levítico</option>
                    <option>Números</option>
                    <option>Deuteronômio</option>

                    <option>Josué</option>
                    <option>Juízes</option>
                    <option>Rute</option>

                    <option>1 Samuel</option>
                    <option>2 Samuel</option>

                    <option>1 Reis</option>
                    <option>2 Reis</option>

                    <option>1 Crônicas</option>
                    <option>2 Crônicas</option>

                    <option>Esdras</option>
                    <option>Neemias</option>
                    <option>Ester</option>
                    <option>Jó</option>
                    <option>Salmos</option>
                    <option>Provérbios</option>
                    <option>Eclesiastes</option>
                    <option>Cânticos</option>

                    <option>Isaías</option>
                    <option>Jeremias</option>
                    <option>Lamentações</option>
                    <option>Ezequiel</option>
                    <option>Daniel</option>

                    <option>Oséias</option>
                    <option>Joel</option>
                    <option>Amós</option>
                    <option>Obadias</option>
                    <option>Jonas</option>
                    <option>Miquéias</option>
                    <option>Naum</option>
                    <option>Habacuque</option>
                    <option>Sofonias</option>
                    <option>Ageu</option>
                    <option>Zacarias</option>
                    <option>Malaquias</option>

                    <option>Mateus</option>
                    <option>Marcos</option>
                    <option>Lucas</option>
                    <option>João</option>
                    <option>Atos</option>
                    <option>Romanos</option>

                    <option>1 Coríntios</option>
                    <option>2 Coríntios</option>

                    <option>Gálatas</option>
                    <option>Efésios</option>
                    <option>Filipenses</option>
                    <option>Colossenses</option>

                    <option>1 Tessalonicenses</option>
                    <option>2 Tessalonicenses</option>

                    <option>1 Timóteo</option>
                    <option>2 Timóteo</option>

                    <option>Tito</option>
                    <option>Filemom</option>
                    <option>Hebreus</option>
                    <option>Tiago</option>

                    <option>1 Pedro</option>
                    <option>2 Pedro</option>

                    <option>1 João</option>
                    <option>2 João</option>
                    <option>3 João</option>

                    <option>Judas</option>
                    <option>Apocalipse</option>

                </select>

            </div>


            <div class="campo">

                <label for="capitulo">
                    Capítulo
                </label>

                <select id="capitulo">

                    <option value="">
                        Selecione o capítulo
                    </option>

                </select>

            </div>


            <div class="campo">

                <label for="versiculo">
                    Versículo
                </label>

                <select id="versiculo">

                    <option value="">
                        Selecione o versículo
                    </option>

                </select>

            </div>


            <button id="btnMostrar">
                Mostrar versículo
            </button>

        </section>


        <!-- ÁREA DO VERSÍCULO -->
        <section class="painel-versiculo">

            <div class="icone-biblia">
                📖
            </div>

            <div class="referencia" id="referencia">
                Selecione uma passagem
            </div>

            <div class="texto-versiculo" id="textoVersiculo">

                O versículo selecionado
                aparecerá aqui.

            </div>

            <button
                class="btn-projetar"
                id="btnProjetar">

                📺 Projetar no telão

            </button>

        </section>

    </main>


    <!-- RODAPÉ -->
    <footer>

        Bíblia da Igreja
        •
        Sistema de projeção

    </footer>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

  </html>
